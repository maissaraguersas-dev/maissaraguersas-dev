<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-label="THE EYE — Multi-chain market surveillance engine"><style>text{font-family:'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',Consolas,'Courier New',monospace}

y="18" r="6" fill="#27c93f"/><text x="360.0" y="23" text-anchor="middle" font-size="12" fill="#00f0ff" opacity=".8" letter-spacing="1">maissara@cyberdeck: ~ — zsh</text><text x="24" y="64" font-size="13" xml:space="preserve" textLength="62.4" lengthAdjust="spacing"><tspan fill="#ff2bd6">$ </tspan><tspan fill="#00f0ff">whoami</tspan></text><text x="24" y="86" font-size="13" xml:space="preserve" textLength="514.8" lengthAdjust="spacing"><tspan fill="#fcee0a">maissara_guersas</tspan><tspan fill="#d6e4ff"> :: CS student · AI architect · ghost in the wires</tspan></text><text x="24" y="108" font-size="13" xml:space="preserve" textLength="156.0" lengthAdjust="spacing"><tspan fill="#ff2bd6">$ </tspan><tspan fill="#00f0ff">cat /proc/identity</tspan></text><text x="24" y="130" font-size="13" xml:space="preserve" textLength="460.2" lengthAdjust="spacing"><tspan fill="#ff2bd6">CLASS        : </tspan><tspan fill="#d6e4ff">Computer Science — final protocols compiling</tspan></text><text x="24" y="152" font-size="13" xml:space="preserve" textLength="514.8" lengthAdjust="spacing"><tspan fill="#ff2bd6">NEURAL CORE  : </tspan><tspan fill="#d6e4ff">multi-agent LLM systems (Claude / OpenCode / Codex)</tspan></text><text x="24" y="174" font-size="13" xml:space="preserve" textLength="499.2" lengthAdjust="spacing"><tspan fill="#ff2bd6">COMBAT MODE  : </tspan><tspan fill="#d6e4ff">OSINT operations · red-team workflows · forensics</tspan></text><text x="24" y="196" font-size="13" xml:space="preserve" textLength="530.4" lengthAdjust="spacing"><tspan fill="#ff2bd6">CHAIN VISION : </tspan><tspan fill="#d6e4ff">Solana forensics · MEV intelligence · rug archaeology</tspan></text><text x="24" y="218" font-size="13" xml:space="preserve" textLength="390.0" lengthAdjust="spacing"><tspan fill="#ff2bd6">$ </tspan><tspan fill="#00f0ff">./deep_scan --target internet --mode adversarial</tspan></text><text x="24" y="240" font-size="13" xml:space="preserve" textLength="530.4" lengthAdjust="spacing"><tspan fill="#39ff88">[OK] </tspan><tspan fill="#d6e4ff">9 subagents online · entities resolved · pattern-of-life mapped</tspan></text><text x="24" y="262" font-size="13" xml:space="preserve" textLength="358.8" lengthAdjust="spacing"><tspan fill="#ff2bd6">$ </tspan><tspan fill="#00f0ff">while(alive) { learn(); build(); repeat(); }</tspan></text><text x="24" y="284" font-size="13" xml:space="preserve" textLength="327.6" lengthAdjust="spacing"><tspan fill="#ff3b5c">^C  → </tspan><tspan fill="#d6e4ff">interrupt ignored :: loop is eternal</tspan></text><text x="24" y="306" font-size="13" xml:space="preserve" textLength="15.6" lengthAdjust="spacing"><tspan fill="#ff2bd6">$ </tspan></text><g class="cv" style="animation:t1 26s linear infinite"><rect x="24" y="51" width="696" height="20" fill="#070716"/><g style="animation:t1c 26s linear infinite" opacity="0"><rect x="24" y="52" width="7.8" height="16" fill="#00f0ff"/></g></g><g class="cv" style="animation:t2 26s linear infinite"><rect x="24" y="73" width="696" height="20" fill="#070716"/><g style="animation:t2c 26s linear infinite" opacity="0"><rect x="24" y="74" width="7.8" height="16" fill="#00f0ff"/></g></g><g class="cv" style="animation:t3 26s linear infinite"><rect x="24" y="95" width="696" height="20" fill="#070716"/><g style="animation:t3c 26s linear infinite" opacity="0"><rect x="24" y="96" width="7.8" height="16" fill="#00f0ff"/></g></g><g class="cv" style="animation:t4 26s linear infinite"><rect x="24" y="117" width="696" height="20" fill="#070716"/><g style="animation:t4c 26s linear infinite" opacity="0"><rect x="24" y="118" width="7.8" height="16" fill="#00f0ff"/></g></g><g class="cv" style="animation:t5 26s linear infinite"><rect x="24" y="139" width="696" height="20" fill="#070716"/><g style="animation:t5c 26s linear infinite" opacity="0"><rect x="24" y="140" width="7.8" height="16" fill="#00f0ff"/></g></g><g class="cv" style="animation:t6 26s linear infinite"><rect x="24" y="161" width="696" height="20" fill="#070
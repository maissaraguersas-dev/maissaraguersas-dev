<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="Terminal typing out: whoami, identity, deep_scan and the main loop"><style>text{font-family:'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',Consolas,'Courier New',monospace}
    @keyframes scan{from{transform:translateY(-70px)}to{transform:translateY(360px)}}
    @keyframes glow{0%,100%{opacity:.35}50%{opacity:.75}}
    @keyframes blinkc{0%{opacity:1}50%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.cv{display:none}}</style><defs><clipPath id="win"><rect width="720" height="340" rx="12"/></clipPath><pattern id="ln" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" opacity=".3"/></pattern><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00f0ff" stop-opacity="0"/><stop offset=".5" stop-color="#00f0ff" stop-opacity=".13"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></linearGradient></defs><g clip-path="url(#win)"><rect width="720" height="340" fill="#070716"/><rect width="720" height="36" fill="#0d0b26"/><rect y="36" width="720" height="1" fill="#00f0ff" opacity=".4"/><circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/><text x="360.0" y="23" text-anchor="middle" font-size="12" fill="#00f0ff" opacity=".8" letter-spacing="1">maissara@cyberdeck: ~ — zsh</text><text x="24" y="64" font-size="13" xml:space="preserve" textLength="62.4" lengthAdjust="spacing"><tspan fill="#ff2bd6">$ </tspan><tspan fill="#00f0ff">whoami</tspan></text><text x="24" y="86" font-size="13" xml:space="preserve" textLength="514.8" lengthAdjust="spacing"><tspan fill="#fcee0a">maissara_guersas</tspan><tspan fill="#d6e4ff"> :: CS student · AI architect · ghost in the wires</tspan></text><text x="24" y="108" font-size="13" xml:space="preserve" textLength="156.0" lengthAdjust="spacing"><tspan fill="#ff2bd6">$ </tspan><tspan fill="#00f0ff">cat /proc/identity</tspan></text><text x="24" y="130" font-size="13" xml:space="preserve" textLength="460.2" lengthAdjust="spacing"><tspan fill="#ff2bd6">CLASS        : </tspan><tspan fill="#d6e4ff">Computer Science — final protocols compiling</tspan></text><text x="24" y="152" font-size="13" xml:space="preserve" textLength="514.8" lengthAdjust="spacing"><tspan fill="#ff2bd6">NEURAL CORE  : </tspan><tspan fill="#d6e4ff">multi-agent LLM systems (Claude / OpenCode / Codex)</tspan></text><text x="24" y="174" font-size="13" xml:space="preserve" textLength="499.2" lengthAdjust="spacing"><tspan fill="#ff2bd6">COMBAT MODE  : </tspan><tspan fill="#d6e4ff">OSINT operations · red-team workflows · forensics</tspan></text><text x="24" y="196" font-size="13" xml:space="preserve" textLength="530.4" lengthAdjust="spacing"><tspan fill="#ff2bd6">CHAIN VISION : </tspan><tspan fill="#d6e4ff">Solana forensics · MEV intelligence · rug archaeology</tspan></text><text x="24" y="218" font-size="13" xml:space="preserve" textLength="390.0" lengthAdjust="spacing"><tspan fill="#ff2bd6">$ </tspan><tspan fill="#00f0ff">./deep_scan --target internet --mode adversarial</tspan></text><text x="24" y="240" font-size="13" xml:space="preserve" textLength="530.4" lengthAdjust="spacing"><tspan fill="#39ff88">[OK] </tspan><tspan fill="#d6e4ff">9 subagents online · entities resolved · pattern-of-life mapped</tspan></text><text x="24" y="262" font-size="13" xml:space="preserve" textLength="358.8" lengthAdjust="spacing"><tspan fill="#ff2bd6">$ </tspan><tspan fill="#00f0ff">while(alive) { learn(); build(); repeat(); }</tspan></text><text x="24" y="284" font-size="13" xml:space="preserve" textLength="327.6" lengthAdjust="spacing"><tspan fill="#ff3b5c">^C  → </tspan><tspan fill="#d6e4ff">interrupt ignored :: loop is eternal</tspan></text><text x="24" y="306" font-size="13" xml:space="preserve" textLength="15.6" lengthAdjust="spacing"><tspan fill="#ff2bd6">$ </tspan></text><g class="cv" style="animation:t1 26s linear infinite"><rect x="24" y="51" width="696" height="20" fill="#070716"/><g style="animation:t1c 26s linear infinite" opacity="0"><rect x="24" y="52" width="7.8" height="16" fill="#00f0ff"/></g></g><g class="cv" style="animation:t2 26s linear infinite"><rect x="24" y="73" width="696" height="20" fill="#070716"/><g style="animation:t2c 26s linear infinite" opacity="0"><rect x="24" y="74" width="7.8" height="16" fill="#00f0ff"/></g></g><g class="cv" style="animation:t3 26s linear infinite"><rect x="24" y="95" width="696" height="20" fill="#070716"/><g style="animation:t3c 26s linear infinite" opacity="0"><rect x="24" y="96" width="7.8" height="16" fill="#00f0ff"/></g></g><g class="cv" style="animation:t4 26s linear infinite"><rect x="24" y="117" width="696" height="20" fill="#070716"/><g style="animation:t4c 26s linear infinite" opacity="0"><rect x="24" y="118" width="7.8" height="16" fill="#00f0ff"/></g></g><g class="cv" style="animation:t5 26s linear infinite"><rect x="24" y="139" width="696" height="20" fill="#070716"/><g style="animation:t5c 26s linear infinite" opacity="0"><rect x="24" y="140" width="7.8" height="16" fill="#00f0ff"/></g></g><g class="cv" style="animation:t6 26s linear infinite"><rect x="24" y="161" width="696" height="20" fill="#070716"/><g style="animation:t6c 26s linear infinite" opacity="0"><rect x="24" y="162" width="7.8" height="16" fill="#00f0ff"/></g></g><g class="cv" style="animation:t7 26s linear infinite"><rect x="24" y="183" width="696" height="20" fill="#070716"/><g style="animation:t7c 26s linear infinite" opacity="0"><rect x="24" y="184" width="7.8" height="16" fill="#00f0ff"/></g></g><g class="cv" style="animation:t8 26s linear infinite"><rect x="24" y="205" width="696" height="20" fill="#070716"/><g style="animation:t8c 26s linear infinite" opacity="0"><rect x="24" y="206" width="7.8" height="16" fill="#00f0ff"/></g></g><g class="cv" style="animation:t9 26s linear infinite"><rect x="24" y="227" width="696" height="20" fill="#070716"/><g style="animation:t9c 26s linear infinite" opacity="0"><rect x="24" y="228" width="7.8" height="16" fill="#00f0ff"/></g></g><g class="cv" style="animation:t10 26s linear infinite"><rect x="24" y="249" width="696" height="20" fill="#070716"/><g style="animation:t10c 26s linear infinite" opacity="0"><rect x="24" y="250" width="7.8" height="16" fill="#00f0ff"/></g></g><g class="cv" style="animation:t11 26s linear infinite"><rect x="24" y="271" width="696" height="20" fill="#070716"/><g style="animation:t11c 26s linear infinite" opacity="0"><rect x="24" y="272" width="7.8" height="16" fill="#00f0ff"/></g></g><g class="cv" style="animation:t12 26s linear infinite"><rect x="24" y="293" width="696" height="20" fill="#070716"/><g style="animation:t12c 26s linear infinite" opacity="0"><rect x="24" y="294" width="7.8" height="16" fill="#00f0ff" style="animation:blinkc 1s steps(1,end) infinite"/></g></g><rect width="720" height="340" fill="url(#ln)"/><rect width="720" height="70" fill="url(#sg)" style="animation:scan 5s linear infinite"/></g><rect x="1" y="1" width="718" height="338" rx="12" fill="none" stroke="#00f0ff" stroke-width="1.6" style="animation:glow 3s ease-in-out infinite"/></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="Terminal typing out: whoami, identity, deep_scan and the main loop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071016"/>
      <stop offset="0.5" stop-color="#071016" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#05050f"/>
    </linearGradient>
    <pattern id="grid" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.3" fill="#000" opacity="0.3"/>
    </pattern>
  </defs>

  <g clip-path="url(#win)">
    <rect width="720" height="340" fill="url(#bg)"/>
    <rect width="720" height="340" fill="url(#grid)" opacity="0.35"/>
    <rect x="0" y="36" width="720" height="1" fill="#00f0ff" opacity="0.4"/>
    <rect x="0" y="0" width="720" height="36" fill="#0d0b26"/>

    <circle cx="22" cy="18" r="6" fill="#ff5f5c"/>
    <circle cx="42" cy="18" r="6" fill="#ffbd2d"/>
    <circle cx="62" cy="18" r="6" fill="#28c940"/>

    <text x="360" y="23" text-anchor="middle" font-size="12" fill="#00f0ff" opacity="0.8" letter-spacing="1">maissara@cyberdeck: ~</text>

    <g opacity="0.5">
      <rect x="24" y="52" width="120" height="16" fill="#00f0ff" opacity="0.12"/>
      <rect x="24" y="76" width="200" height="16" fill="#00f0ff" opacity="0.1"/>
      <rect x="24" y="100" width="260" height="16" fill="#00f0ff" opacity="0.12"/>
      <rect x="24" y="124" width="270" height="16" fill="#00f0ff" opacity="0.12"/>
      <rect x="24" y="148" width="300" height="16" fill="#00f0ff" opacity="0.12"/>
      <rect x="24" y="172" width="390" height="16" fill="#00f0ff" opacity="0.12"/>
      <rect x="24" y="196" width="340" height="16" fill="#00f0ff" opacity="0.12"/>
      <rect x="24" y="220" width="210" height="16" fill="#00f0ff" opacity="0.1"/>
      <rect x="24" y="244" width="260" height="16" fill="#00f0ff" opacity="0.1"/>
      <rect x="24" y="268" width="210" height="16" fill="#00f0ff" opacity="0.1"/>
      <rect x="24" y="292" width="170" height="16" fill="#00f0ff" opacity="0.1"/>
    </g>

    <text x="24" y="66" font-size="13" xml:space="preserve" lengthAdjust="spacingAndGlyphs" fill="#ff2bd6">$</text>
    <text x="38" y="66" font-size="13" xml:space="preserve" fill="#00f0ff">whoami</text>

    <text x="24" y="88" font-size="13" xml:space="preserve" fill="#fce30a">maissara_guersas</text>
    <text x="24" y="110" font-size="13" xml:space="preserve" fill="#ff2bd6">$</text>
    <text x="38" y="110" font-size="13" xml:space="preserve" fill="#00f0ff">cat /proc/identity</text>

    <text x="24" y="132" font-size="13" xml:space="preserve" fill="#d6e4ff">CS student</text>
    <text x="120" y="132" font-size="13" xml:space="preserve" fill="#00f0ff">AI architect</text>
    <text x="235" y="132" font-size="13" xml:space="preserve" fill="#d6e4ff">ghost in the wires</text>

    <text x="24" y="154" font-size="13" xml:space="preserve" fill="#ff2bd6">$</text>
    <text x="38" y="154" font-size="13" xml:space="preserve" fill="#00f0ff">deep_scan --target internet --mode adversarial</text>

    <text x="24" y="176" font-size="13" xml:space="preserve" fill="#ff2bd6">[OK]</text>
    <text x="80" y="176" font-size="13" xml:space="preserve" fill="#d6e4ff">9 subagents online</text>
    <text x="220" y="176" font-size="13" xml:space="preserve" fill="#00f0ff">entities resolved</text>

    <text x="24" y="198" font-size="13" xml:space="preserve" fill="#ff2bd6">$</text>
    <text x="38" y="198" font-size="13" xml:space="preserve" fill="#00f0ff">while(alive) { learn(); build(); repeat(); }</text>

    <text x="24" y="220" font-size="13" xml:space="preserve" fill="#ff2bd6">^C</text>
    <text x="54" y="220" font-size="13" xml:space="preserve" fill="#00f0ff">interrupt ignored :: loop is eternal</text>

    <text x="24" y="244" font-size="13" xml:space="preserve" fill="#ff2bd6">$</text>
    <text x="38" y="244" font-size="13" xml:space="preserve" fill="#00f0ff">. /deep_scan</text>

    <text x="24" y="266" font-size="13" xml:space="preserve" fill="#39ff88">[+] pattern-of-life mapped</text>

    <text x="24" y="288" font-size="13" xml:space="preserve" fill="#ff2bd6">$</text>
    <text x="38" y="288" font-size="13" xml:space="preserve" fill="#00f0ff">main_loop()</text>

    <rect x="1" y="1" width="718" height="338" rx="12" fill="none" stroke="#00f0ff" stroke-width="1.6" opacity="0.8"/>
  </g>
</svg>

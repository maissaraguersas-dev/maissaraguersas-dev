<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-label="ONE STEP AHEAD — Anti-paralysis micro-step engine"><style>text{font-family:'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',Consolas,'Courier New',monospace}
    @keyframes march{to{stroke-dashoffset:-68}}
    @keyframes sw{from{transform:translateX(-120px)}to{transform:translateX(920px)}}
    @keyframes gm{0%,88%,100%{transform:translate(-1.5px,0)}90%{transform:translate(-8px,1px)}92%{transform:translate(5px,0)}94%{transform:translate(-1.5px,0)}}
    @keyframes gc{0%,88%,100%{transform:translate(1.5px,0)}90%{transform:translate(8px,-1px)}92%{transform:translate(-5px,0)}94%{transform:translate(1.5px,0)}}
    @keyframes bl{0%,49%{opacity:1}50%,100%{opacity:.1}}
    @keyframes chip{0%,100%{opacity:.7}50%{opacity:1}}
    @keyframes blip{0%{opacity:1;transform:scale(1.9)}40%{opacity:.25;transform:scale(1)}100%{opacity:.12;transform:scale(1)}}
    @keyframes slab{0%{opacity:.85}12%{opacity:.85}40%,100%{opacity:0}}
    @keyframes drop{0%{transform:translateY(0);opacity:0}6%{opacity:1}90%{opacity:1}100%{transform:translateY(190px);opacity:0}}
    @keyframes loop{to{stroke-dashoffset:-22}}
    @keyframes iris{0%,100%{transform:translateX(-26px)}50%{transform:translateX(26px)}}
    @keyframes lid{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.06)}}
    @keyframes scanb{0%{transform:translateY(0)}100%{transform:translateY(150px)}}
    @keyframes chf{0%,100%{opacity:.45}12%{opacity:1}30%{opacity:.45}}
    @keyframes ring{0%{stroke-dashoffset:var(--C)}66%,100%{stroke-dashoffset:0}}
    @keyframes num{0%{opacity:1}16.6%,100%{opacity:0}}
    @keyframes done{0%,68%{stroke-dashoffset:100;opacity:0}70%{opacity:1}80%,96%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}
    @keyframes ghost{0%,60%{opacity:.35;transform:translateX(0)}75%,100%{opacity:0;transform:translateX(60px)}}
    .blip{transform-box:fill-box;transform-origin:50% 50%;animation:blip 5s linear infinite;opacity:.12}
    .slab{opacity:0;animation:slab 4s linear infinite}
    .drop{animation:drop 4s linear infinite}
    .loop{animation:loop .7s linear infinite}
    .iris{animation:iris 5s ease-in-out infinite}
    .lid{transform-box:fill-box;transform-origin:50% 50%;animation:lid 6s ease-in-out infinite}
    .scanb{animation:scanb 2.4s linear infinite alternate}
    .ch{animation:chf 4s linear infinite}
    .ring{animation:ring 6s linear infinite}
    .num{opacity:0}
    .done path{animation:done 6s linear infinite}
    .ghost{animation:ghost 6s ease-in infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.cv{display:none}}@keyframes num0{0%,0.00%{opacity:0}0.01%,16.67%{opacity:1}16.68%,100%{opacity:0}}@keyframes num1{0%,16.67%{opacity:0}16.68%,33.33%{opacity:1}33.34%,100%{opacity:0}}@keyframes num2{0%,33.33%{opacity:0}33.34%,50.00%{opacity:1}50.01%,100%{opacity:0}}@keyframes num3{0%,50.00%{opacity:0}50.01%,66.67%{opacity:1}66.68%,100%{opacity:0}}@keyframes num4{0%,66.67%{opacity:0}66.68%,83.33%{opacity:1}83.34%,100%{opacity:0}}</style><defs><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="800" height="250"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glow2" filterUnits="userSpaceOnUse" x="0" y="0" width="800" height="250"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="sweep" cx="672" cy="128" r="86" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fcee0a" stop-opacity="0"/><stop offset="1" stop-color="#fcee0a" stop-opacity=".55"/></radialGradient><linearGradient id="swp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fcee0a" stop-opacity="0"/><stop offset=".5" stop-color="#fcee0a" stop-opacity=".16"/><stop offset="1" stop-color="#fcee0a" stop-opacity="0"/></linearGradient><pattern id="ln" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" opacity=".3"/></pattern><clipPath id="r"><rect x="2" y="2" width="796" height="246" rx="12"/></clipPath></defs><g clip-path="url(#r)"><rect width="800" height="250" fill="#07071a"/><rect x="548" y="0" width="252" height="250" fill="#fcee0a" opacity=".05"/><rect x="548" y="14" width="1" height="222" fill="#fcee0a" opacity=".35"/><circle cx="672" cy="112" r="60" fill="none" stroke="#1a1a3a" stroke-width="10"/><circle class="ring" cx="672" cy="112" r="60" fill="none" stroke="#fcee0a" stroke-width="10" stroke-linecap="round" stroke-dasharray="377.0" transform="rotate(-90 672 112)" style="--C:377.0"/><text class="num" x="672" y="124" text-anchor="middle" font-size="34" font-weight="700" fill="#fff" style="animation:num0 6s linear infinite">2:00</text><text class="num" x="672" y="124" text-anchor="middle" font-size="34" font-weight="700" fill="#fff" style="animation:num1 6s linear infinite">1:30</text><text class="num" x="672" y="124" text-anchor="middle" font-size="34" font-weight="700" fill="#fff" style="animation:num2 6s linear infinite">1:00</text><text class="num" x="672" y="124" text-anchor="middle" font-size="34" font-weight="700" fill="#fff" style="animation:num3 6s linear infinite">0:30</text><text class="num" x="672" y="124" text-anchor="middle" font-size="34" font-weight="700" fill="#fff" style="animation:num4 6s linear infinite">0:00</text><g class="done"><path d="M652 114 L666 128 L694 98" fill="none" stroke="#00f0ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100"/></g><rect class="ghost" x="602.0" y="214" width="140" height="6" rx="3" fill="#fcee0a" style="animation-delay:0.00s"/><rect class="ghost" x="617.0" y="225" width="110" height="6" rx="3" fill="#fcee0a" style="animation-delay:0.15s"/><rect class="ghost" x="608.0" y="236" width="128" height="6" rx="3" fill="#fcee0a" style="animation-delay:0.30s"/><text x="672" y="204" text-anchor="middle" font-size="10.5" font-weight="700" fill="#00f0ff" letter-spacing="3">ONE STEP. NOW.</text><text x="34" y="40" font-size="11" fill="#00f0ff" letter-spacing="3">[ PROJECT 04 // DEPLOYED ]</text><text x="34" y="90" font-family="Impact,'Arial Black','Segoe UI Black','Helvetica Neue',sans-serif" font-size="42" font-weight="900" fill="#00f0ff" textLength="356" lengthAdjust="spacingAndGlyphs" style="mix-blend-mode:screen;animation:gm 4.4s linear infinite">ONE STEP AHEAD</text><text x="34" y="90" font-family="Impact,'Arial Black','Segoe UI Black','Helvetica Neue',sans-serif" font-size="42" font-weight="900" fill="#fcee0a" textLength="356" lengthAdjust="spacingAndGlyphs" style="mix-blend-mode:screen;animation:gc 4.4s linear infinite">ONE STEP AHEAD</text><text x="34" y="90" font-family="Impact,'Arial Black','Segoe UI Black','Helvetica Neue',sans-serif" font-size="42" font-weight="900" fill="#ffffff" textLength="356" lengthAdjust="spacingAndGlyphs" >ONE STEP AHEAD</text><text x="34" y="116" font-size="13" font-weight="700" fill="#fcee0a" letter-spacing="1">Anti-paralysis micro-step engine</text><text x="34" y="142" font-size="11.5" fill="#d6e4ff" opacity=".92" xml:space="preserve">Surfaces exactly ONE two-minute action at a time, then hides</text><text x="34" y="159" font-size="11.5" fill="#d6e4ff" opacity=".92" xml:space="preserve">everything else. Claude-powered live mode, offline demo</text><text x="34" y="176" font-size="11.5" fill="#d6e4ff" opacity=".92" xml:space="preserve">engine, WCAG 2.2 AA accessible. Built for frozen brains, by a</text><text x="34" y="193" font-size="11.5" fill="#d6e4ff" opacity=".92" xml:space="preserve">frozen brain.</text><g style="animation:chip 2.4s ease-in-out infinite"><rect x="34" y="212" width="126" height="22" rx="11" fill="none" stroke="#fcee0a" stroke-width="1.3"/><text x="97" y="227" text-anchor="middle" font-size="10" font-weight="700" fill="#fcee0a" letter-spacing="1">CLAUDE-POWERED</text></g><g style="animation:chip 2.8s ease-in-out infinite"><rect x="169.60000000000002" y="212" width="103" height="22" rx="11" fill="none" stroke="#fcee0a" stroke-width="1.3"/><text x="221" y="227" text-anchor="middle" font-size="10" font-weight="700" fill="#fcee0a" letter-spacing="1">WCAG 2.2 AA</text></g><g style="animation:chip 3.2s ease-in-out infinite"><rect x="283.0" y="212" width="111" height="22" rx="11" fill="none" stroke="#fcee0a" stroke-width="1.3"/><text x="338" y="227" text-anchor="middle" font-size="10" font-weight="700" fill="#fcee0a" letter-spacing="1">OFFLINE DEMO</text></g><tex
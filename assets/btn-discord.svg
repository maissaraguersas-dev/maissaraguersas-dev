<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" role="img" aria-label="DISCORD"><style>
    text{font-family:'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',Consolas,'Courier New',monospace}
    @keyframes march{to{stroke-dashoffset:-48}}
    @keyframes pulse{0%,100%{opacity:.15}50%{opacity:.55}}
    @keyframes sweep{from{transform:translateX(-80px)}to{transform:translateX(300px)}}
    @keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.cv{display:none}}</style><defs><filter id="b" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="7"/></filter><clipPath id="c"><rect x="4" y="4" width="232" height="56" rx="8"/></clipPath><linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7289ff" stop-opacity="0"/><stop offset=".5" stop-color="#7289ff" stop-opacity=".45"/><stop offset="1" stop-color="#7289ff" stop-opacity="0"/></linearGradient></defs><rect x="8" y="8" width="224" height="48" rx="8" fill="#7289ff" filter="url(#b)" style="animation:pulse 2.6s ease-in-out infinite"/><rect x="4" y="4" width="232" height="56" rx="8" fill="#07071a"/><g clip-path="url(#c)"><rect x="0" y="0" width="80" height="64" fill="url(#sw)" style="animation:sweep 3.2s ease-in-out infinite"/></g><rect x="4" y="4" width="232" height="56" rx="8" fill="none" stroke="#7289ff" stroke-width="2" stroke-dasharray="14 10" style="animation:march 1.4s linear infinite"/><text x="30" y="40" font-size="20" font-weight="700" fill="#7289ff">◈</text><text x="62" y="39" font-size="16" font-weight="700" fill="#fff" letter-spacing="2">DISCORD</text><rect x="206" y="27" width="9" height="14" fill="#7289ff" style="animation:bl 1s steps(1) infinite"/></svg>
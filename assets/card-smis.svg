ay:2.50s"/><text x="612" y="172" font-size="9.5" font-weight="700" fill="#fff">L6</text><text x="712" y="172" text-anchor="end" font-size="8.5" fill="#d6e4ff" opacity=".85">NARRATIVE</text><rect x="604" y="184" width="116" height="17" rx="3" fill="#0b0b22" stroke="#ff2bd6" stroke-opacity=".4"/><rect class="slab" x="604" y="184" width="116" height="17" rx="3" fill="#ff2bd6" style="animation-delay:3.00s"/><text x="612" y="196" font-size="9.5" font-weight="700" fill="#fff">L7</text><text x="712" y="196" text-anchor="end" font-size="8.5" fill="#d6e4ff" opacity=".85">RISK</text><rect x="604" y="208" width="116" height="17" rx="3" fill="#0b0b22" stroke="#ff2bd6" stroke-opacity=".4"/><rect class="slab" x="604" y="208" width="116" height="17" rx="3" fill="#00f0ff" style="animation-delay:3.50s"/><text x="612" y="220" font-size="9.5" font-weight="700" fill="#fff">L8</text><text x="712" y="220" text-anchor="end" font-size="8.5" fill="#d6e4ff" opacity=".85">USS SCORE</text><circle class="drop" cx="662.0" cy="30" r="3.4" fill="#fff"/><path class="loop" d="M724 216.5 C774 216.5 774 48.5 728 48.5" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="5 6"/><path d="M734 43.5 L726 48.5 L734 53.5" fill="none" stroke="#00f0ff" stroke-width="2"/><text x="782" y="128.25" font-size="8.5" fill="#00f0ff" transform="rotate(90 782 128.25)" text-anchor="middle" letter-spacing="2">SELF-LEARNING LOOP</text><text x="34" y="40" font-size="11" fill="#00f0ff" letter-spacing="3">[ PROJECT 02 // DEPLOYED ]</text><text x="34" y="90" font-family="Impact,'Arial Black','Segoe UI Black','Helvetica Neue',sans-serif" font-size="42" font-weight="900" fill="#00f0ff" textLength="106" lengthAdjust="spacingAndGlyphs" style="mix-blend-mode:screen;animation:gm 4.4s linear infinite">SMIS</text><text x="34" y="90" font-family="Impact,'Arial Black','Segoe UI Black','Helvetica Neue',sans-serif" font-size="42" font-weight="900" fill="#ff2bd6" textLength="106" lengthAdjust="spacingAndGlyphs" style="mix-blend-